                  example: 2c91808a7813090a017814121919ecca
                  in: path
                  name: id
                  required: true
                  schema:
                    type: string
                  style: simple
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    id:
                                        type: string
                                    name:
                                        type: string
                                    status:
                                        enum:
                                            - ACTIVE
                                            - INACTIVE
                                            - PENDING
                                            - DELETED
                                        type: string
                                type: object
